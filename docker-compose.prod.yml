services:
  web:
    build:
      args:
        VITE_SERVER_URL: https://api.koirankoulutus.com
    ports: !override
      - "127.0.0.1:18473:80"

  server:
    environment:
      CORS_ORIGIN: https://koirankoulutus.com
    ports: !override
      - "127.0.0.1:18474:3000"

  postgres:
    ports: !override []

  # Only the server needs MinIO, over the compose network. Port 9000 is also taken on the host
  # by another project's MinIO.
  minio:
    ports: !override []
