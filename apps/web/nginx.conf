# Link-preview crawlers don't run JavaScript; they get server-rendered Open Graph tags from /share.
map $http_user_agent $is_link_preview {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|whatsapp|linkedinbot|slackbot|discordbot|telegrambot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded photos (served by the API server from S3), sitemap and robots come from the server.
    location ^~ /media/ {
        proxy_pass http://server:3000;
    }
    location = /sitemap.xml {
        proxy_pass http://server:3000;
    }
    location = /robots.txt {
        proxy_pass http://server:3000;
    }

    # Page URLs (no file extension): crawlers get /share/<path>, people get the SPA.
    location ~ ^[^.]*$ {
        if ($is_link_preview) {
            rewrite ^ /share$uri break;
            proxy_pass http://server:3000;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
